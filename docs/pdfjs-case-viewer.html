<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CaseTools PDF.js Viewer</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #2a2a2e;
            color: #f9f9fb;
        }

        .loading {
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="loading">Loading PDF.js viewer...</div>
    <script type="module">
        import {
            rewritePdfjsViewerHtml,
            rewritePdfjsViewerScript,
        } from './utils/pdf/pdfjsViewerLoader.js';

        const PDFJS_ROOT = 'https://mozilla.github.io/pdf.js/';
        const PDFJS_WEB = `${PDFJS_ROOT}web/`;
        const PDFJS_BUILD = `${PDFJS_ROOT}build/`;
        const BRIDGE_URL = new URL('./utils/pdf/pdfjsCaseViewerBridge.js', window.location.href).href;

        try {
            const [viewerHtml, viewerScript] = await Promise.all([
                fetch(`${PDFJS_WEB}viewer.html`).then(response => {
                    if (!response.ok) throw new Error(`Failed to load PDF.js viewer HTML: ${response.status}`);
                    return response.text();
                }),
                fetch(`${PDFJS_WEB}viewer.mjs`).then(response => {
                    if (!response.ok) throw new Error(`Failed to load PDF.js viewer script: ${response.status}`);
                    return response.text();
                }),
            ]);

            const patchedViewerScript = rewritePdfjsViewerScript(viewerScript, {
                pdfjsWebUrl: PDFJS_WEB,
                pdfjsBuildUrl: PDFJS_BUILD,
            });

            const viewerScriptUrl = URL.createObjectURL(new Blob([patchedViewerScript], { type: 'text/javascript' }));
            const rewrittenHtml = rewritePdfjsViewerHtml(viewerHtml, {
                pdfjsWebUrl: PDFJS_WEB,
                pdfjsBuildUrl: PDFJS_BUILD,
                viewerScriptUrl,
                bridgeUrl: BRIDGE_URL,
            });

            document.open();
            document.write(rewrittenHtml);
            document.close();
        } catch (error) {
            const detail = error?.message || String(error);
            console.error(error);
            const errorElement = document.createElement('div');
            errorElement.className = 'loading';
            errorElement.textContent = `Could not load PDF.js viewer: ${detail}`;
            document.body.replaceChildren(errorElement);
            window.parent.postMessage({
                type: 'case-tools-pdfjs-error',
                message: 'Could not load PDF.js viewer.',
                detail,
            }, window.location.origin);
        }
    </script>
</body>
</html>
